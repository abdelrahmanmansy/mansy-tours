name: Publish GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build
        env:
          DEPLOY_TARGET: github

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add --detach --force .pages origin/gh-pages
          find .pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r out/. .pages/
          touch .pages/.nojekyll
          git -C .pages add -A
          if git -C .pages diff --cached --quiet; then
            echo "gh-pages already up to date"
          else
            git -C .pages commit -m "Publish static site to gh-pages"
            git -C .pages push origin HEAD:gh-pages
          fi
          git worktree remove --force .pages
